<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>

  <!-- Internet -->
  <text x="700" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#111">Internet</text>
  <circle cx="560" cy="120" r="38" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="560" y="127" text-anchor="middle" font-size="18" fill="#222">User</text>
  <text x="470" y="182" text-anchor="middle" font-size="15" fill="#555">browser / curl</text>
  <circle cx="860" cy="120" r="38" fill="#fff" stroke="#333" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="860" y="118" text-anchor="middle" font-size="16" fill="#222">Admin</text>
  <text x="860" y="137" text-anchor="middle" font-size="13" fill="#555">My IP/32</text>

  <!-- arrows to IGW -->
  <line x1="575" y1="158" x2="650" y2="258" stroke="#1a5fb4" stroke-width="3" marker-end="url(#arr)"/>
  <text x="595" y="232" text-anchor="end" font-size="16" fill="#1a5fb4">HTTP :80 (0.0.0.0/0)</text>
  <line x1="845" y1="158" x2="750" y2="258" stroke="#a51d2d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arr)"/>
  <text x="815" y="232" font-size="16" fill="#a51d2d">SSH :22 (My IP only)</text>

  <!-- IGW -->
  <rect x="560" y="262" width="280" height="80" rx="10" fill="#fff4cc" stroke="#a37f00" stroke-width="3"/>
  <text x="700" y="298" text-anchor="middle" font-size="21" fill="#222">Internet Gateway</text>
  <text x="700" y="324" text-anchor="middle" font-size="15" fill="#555">codyssey-igw (Public IP ↔ Private IP)</text>

  <!-- VPC -->
  <rect x="60" y="400" width="1280" height="530" rx="14" fill="#eef5ff" stroke="#2a62a8" stroke-width="3"/>
  <text x="95" y="442" font-size="24" font-weight="bold" fill="#2a62a8">VPC codyssey-vpc (10.0.0.0/16) · ap-northeast-2</text>

  <!-- Route table -->
  <rect x="95" y="462" width="560" height="78" rx="8" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="115" y="490" font-size="17" fill="#333" font-weight="bold">Route Table codyssey-public-rtb</text>
  <text x="115" y="514" font-size="16" fill="#333">10.0.0.0/16 → local</text>
  <text x="115" y="534" font-size="16" fill="#333">0.0.0.0/0 → Internet Gateway</text>
  <line x1="375" y1="540" x2="375" y2="560" stroke="#888" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Subnet -->
  <rect x="95" y="560" width="1210" height="320" rx="12" fill="#e5fbe9" stroke="#2e7d4f" stroke-width="3"/>
  <text x="125" y="600" font-size="22" font-weight="bold" fill="#2e7d4f">Public Subnet codyssey-public-subnet (10.0.1.0/24) · ap-northeast-2a</text>

  <!-- SG -->
  <rect x="135" y="625" width="1130" height="225" rx="12" fill="#fff" stroke="#c4501a" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="165" y="663" font-size="20" font-weight="bold" fill="#c4501a">Security Group codyssey-web-sg</text>
  <text x="165" y="697" font-size="17" fill="#222">Inbound 80/tcp  ← 0.0.0.0/0</text>
  <text x="165" y="725" font-size="17" fill="#222">Inbound 22/tcp  ← My IP /32 only</text>
  <text x="165" y="753" font-size="17" fill="#222">Outbound all (default)</text>
  <text x="165" y="790" font-size="16" fill="#666">No 0.0.0.0/0 all-ports rule</text>

  <!-- EC2 -->
  <rect x="790" y="660" width="430" height="160" rx="12" fill="#fffbc2" stroke="#a37f00" stroke-width="3"/>
  <text x="1005" y="702" text-anchor="middle" font-size="23" font-weight="bold" fill="#222">EC2 codyssey-web</text>
  <text x="1005" y="732" text-anchor="middle" font-size="17" fill="#333">t3.micro · Amazon Linux 2023</text>
  <text x="1005" y="760" text-anchor="middle" font-size="17" fill="#333">Nginx :80  ( / , /health → OK )</text>
  <text x="1005" y="790" text-anchor="middle" font-size="15" fill="#666">Auto-assigned Public IP · EBS root volume</text>

  <!-- traffic IGW -> EC2 -->
  <path d="M840,312 C1010,330 1005,520 1005,656" fill="none" stroke="#1a5fb4" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1030" y="470" font-size="16" fill="#1a5fb4">inbound to 10.0.1.x</text>

  <text x="700" y="960" text-anchor="middle" font-size="15" fill="#666">Request: User → IGW → Route Table (local) → Security Group (80 allowed) → EC2 Nginx · Response returns via 0.0.0.0/0 → IGW</text>
</svg>
